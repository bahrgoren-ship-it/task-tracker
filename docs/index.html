<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>משימות</title>
  <meta name="description" content="מעקב משימות ושיעורי בית — טכניון">
  <meta name="theme-color" content="#F1F3F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11141A" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="משימות">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <h1 id="screenTitle">משימות</h1>
          <p id="summary" class="summary"></p>
        </div>
        <div class="top-actions">
          <button id="syncPill" class="sync-pill" type="button" title="סנכרון"></button>
          <button id="settingsBtn" class="icon-btn" type="button" aria-label="הגדרות">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          </button>
        </div>
      </div>
      <nav id="filters" class="filters" aria-label="סינון לפי קורס"></nav>
    </header>

    <main id="main" class="main"></main>
    <section id="planner" class="planner" hidden></section>
    <section id="inbox" class="main inbox" hidden></section>

    <div id="timerBar" class="timer-bar" hidden></div>

    <button id="addBtn" class="fab" type="button" aria-label="משימה חדשה">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>משימה חדשה</span>
    </button>

    <nav class="tabbar" aria-label="מסכים">
      <button class="tab active" type="button" data-tab="tasks">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>
        <span>משימות</span>
      </button>
      <button class="tab" type="button" data-tab="planner">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
        <span>תכנון</span>
      </button>
      <button class="tab" type="button" data-tab="inbox">
        <span class="tab-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H5.2L4 17.5V4Z"/><path d="M8 9h8M8 12h5"/></svg><b id="inboxBadge" class="badge" hidden></b></span>
        <span>הודעות</span>
      </button>
    </nav>
  </div>

  <dialog id="editor" class="sheet"></dialog>
  <dialog id="settings" class="sheet"></dialog>
  <dialog id="timerSheet" class="sheet"></dialog>
  <dialog id="blockSheet" class="sheet"></dialog>
  <dialog id="catSheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
